<style>

.btn{display:block;text-decoration:none;text-align:center;padding:13px;border-radius:14px;margin-top:10px;font-weight:bold}
.call{background:#fff;color:#07111f}
.sos{background:#e53935;color:#fff;font-size:17px;box-shadow:0 6px 20px rgba(229,57,53,.45)} .fb{background:#1877f2;color:#fff}
.note{font-size:12px;color:#b7c8d3;text-align:center;margin-top:20px;line-height:1.6}
</style>
